name: Build Flasher & Settings APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer_apk/**'
      - 'car_settings_bridge/**'
      - '.github/workflows/build_apks.yml'

jobs:
  build_apks:
    name: Build Flasher & Settings APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Build Installer APK
        run: |
          cd installer_apk
          gradle assembleDebug --stacktrace

      - name: Build Car Settings Bridge APK
        run: |
          cd car_settings_bridge
          gradle assembleDebug --stacktrace

      - name: Upload Installer APK
        uses: actions/upload-artifact@v4
        with:
          name: TS8667_TWRP_Flasher_APK
          path: installer_apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Car Settings Bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: TS8667_Car_Settings_Bridge_APK
          path: car_settings_bridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
