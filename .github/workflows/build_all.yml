name: Build APKs and TWRP

on:
  workflow_dispatch:
  push:
    paths:
      - 'twrp_device_tree/**'
      - 'installer_apk/**'
      - 'car_settings_bridge/**'
      - '.github/workflows/build_all.yml'

jobs:
  build_apk:
    name: Build Flasher & Settings APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Build Installer APK
        run: |
          cd installer_apk
          gradle assembleDebug --stacktrace

      - name: Build Car Settings Bridge APK
        run: |
          cd car_settings_bridge
          gradle assembleDebug --stacktrace

      - name: Upload Installer APK
        uses: actions/upload-artifact@v4
        with:
          name: TS8667_TWRP_Flasher_APK
          path: installer_apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Car Settings Bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: TS8667_Car_Settings_Bridge_APK
          path: car_settings_bridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build_twrp:
    name: Build TWRP Recovery Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android /opt/ghc
          # Safely replace default 4GB swap with 10GB swap to prevent OOM
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig libssl-dev python3 python-is-python3 rsync bc

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Minimal TWRP 10.0 Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "Antigravity CI"
          git config --global user.email "ci@antigravity.local"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0
          ~/bin/repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Place Device Tree
        run: |
          mkdir -p ~/twrp/device/topway/ts8667
          cp -r twrp_device_tree/* ~/twrp/device/topway/ts8667/

      - name: Build TWRP Recovery
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_ts8667-eng || lunch twrp_ts8667-eng
          mka recoveryimage -j$(nproc --all)

      - name: Prepare Artifacts & Add AVB Hash Footer
        run: |
          OUT_DIR=~/twrp/out/target/product/ts8667
          if [ -f "$OUT_DIR/recovery.img" ]; then
            cp "$OUT_DIR/recovery.img" ./twrp_ts8667_raw.img
            python3 -m pip install avbtool 2>/dev/null || true
            if command -v avbtool >/dev/null; then
              avbtool add_hash_footer \
                --image ./twrp_ts8667_raw.img \
                --partition_size 33554432 \
                --partition_name recovery \
                --algorithm SHA256_RSA2048 \
                --key ~/twrp/external/avb/test/data/testkey_rsa2048.pem 2>/dev/null || true
            fi
            mv ./twrp_ts8667_raw.img ./twrp_ts8667_landscape_1280x720.img
          else
            echo "Recovery image not found in out directory"
            exit 1
          fi

      - name: Upload TWRP Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: twrp_ts8667_landscape_1280x720
          path: ./twrp_ts8667_landscape_1280x720.img
          if-no-files-found: error
