name: Build TWRP Recovery Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'twrp_device_tree/**'
      - 'tools/**'
      - '.github/workflows/build_twrp.yml'

jobs:
  build_twrp:
    name: Build TWRP Recovery Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android /opt/ghc
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig libssl-dev python3 python-is-python3 rsync bc

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Minimal TWRP 10.0 Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "Antigravity CI"
          git config --global user.email "ci@antigravity.local"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          ~/bin/repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Place Device Tree
        run: |
          mkdir -p ~/twrp/device/topway/ts8667
          cp -r twrp_device_tree/* ~/twrp/device/topway/ts8667/

      - name: Build TWRP Recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          set +e
          source build/envsetup.sh
          set -e
          lunch omni_ts8667-eng || lunch twrp_ts8667-eng
          mka recoveryimage -j$(nproc --all)

      - name: Prepare Artifacts & Add AVB Hash Footer
        run: |
          set -e
          OUT_DIR=~/twrp/out/target/product/ts8667
          TARGET_FILE="twrp_junsun_${{ github.run_number }}.img"
          if [ ! -f "$OUT_DIR/recovery.img" ]; then
            echo "Recovery image not found in out directory"
            exit 1
          fi

          cp "$OUT_DIR/recovery.img" ./twrp_raw.img

          # Locate avbtool from TWRP source tree or system PATH
          if [ -f ~/twrp/external/avb/avbtool ]; then
            AVBTOOL="python3 ~/twrp/external/avb/avbtool"
          elif command -v avbtool >/dev/null; then
            AVBTOOL="avbtool"
          else
            echo "ERROR: avbtool not found in ~/twrp/external/avb/avbtool or PATH"
            exit 1
          fi
          echo "Using AVB tool: $AVBTOOL"

          # Determine RSA key for AVB signing
          AVB_KEY=~/twrp/external/avb/test/data/testkey_rsa2048.pem
          if [ ! -f "$AVB_KEY" ]; then
            echo "Generating fallback RSA2048 signing key..."
            openssl genrsa -out ./avb_key.pem 2048
            AVB_KEY=./avb_key.pem
          fi

          # Truncate image to exact unpadded Android boot image v2 boundary before footer injection
          python3 -c '
          import struct, sys
          target_path = "./twrp_raw.img"
          with open(target_path, "r+b") as f:
              header = f.read(2048)
              magic, k_sz, k_addr, r_sz, r_addr, s_sz, s_addr, tags_addr, page_sz, ver = struct.unpack("<8s9I", header[:44])
              if magic != b"ANDROID!":
                  raise ValueError(f"Invalid magic header: {magic}")
              def pad(sz): return ((sz + page_sz - 1) // page_sz) * page_sz
              total_sz = page_sz + pad(k_sz) + pad(r_sz) + pad(s_sz)
              if ver >= 1:
                  dtbo_sz = struct.unpack("<I", header[1632:1636])[0]
                  total_sz += pad(dtbo_sz)
              if ver >= 2:
                  dtb_sz = struct.unpack("<I", header[1648:1652])[0]
                  total_sz += pad(dtb_sz)
              current_sz = f.seek(0, 2)
              print(f"Header version {ver}, calculated raw payload size: {total_sz} bytes (current size: {current_sz} bytes)")
              if current_sz > total_sz:
                  print(f"Truncating {target_path} to {total_sz} bytes prior to avbtool footer injection")
                  f.truncate(total_sz)
          '

          # Inject AVB hash footer without suppressing errors
          $AVBTOOL add_hash_footer \
            --image ./twrp_raw.img \
            --partition_size 33554432 \
            --partition_name recovery \
            --algorithm SHA256_RSA2048 \
            --key "$AVB_KEY"

          # Rigorous verification of output image
          ACTUAL_SIZE=$(stat -c%s ./twrp_raw.img)
          echo "Generated image size: $ACTUAL_SIZE bytes"
          if [ "$ACTUAL_SIZE" -ne 33554432 ]; then
            echo "ERROR: Partition size mismatch. Expected 33554432 bytes, got $ACTUAL_SIZE bytes"
            exit 1
          fi

          # Verify AVB structure and extract report
          $AVBTOOL info_image --image ./twrp_raw.img > avb_verification_report.txt
          echo "=== AVB Verification Report ==="
          cat avb_verification_report.txt

          grep -q "Footer version:.*1.0" avb_verification_report.txt || { echo "ERROR: Missing AVB Footer version 1.0"; exit 1; }
          grep -q "Partition Name:.*recovery" avb_verification_report.txt || { echo "ERROR: Partition name is not recovery"; exit 1; }
          grep -q "Algorithm:.*SHA256_RSA2048" avb_verification_report.txt || { echo "ERROR: Algorithm is not SHA256_RSA2048"; exit 1; }

          # Calculate SHA-256
          sha256sum ./twrp_raw.img > sha256_recovery.txt
          echo "=== SHA-256 Digest ==="
          cat sha256_recovery.txt

          mv ./twrp_raw.img ./${TARGET_FILE}
          echo "TARGET_FILE=${TARGET_FILE}" >> $GITHUB_ENV

      - name: Upload TWRP Recovery Image & Reports
        uses: actions/upload-artifact@v4
        with:
          name: twrp_junsun_${{ github.run_number }}_package
          path: |
            ./${{ env.TARGET_FILE }}
            avb_verification_report.txt
            sha256_recovery.txt
          if-no-files-found: error
