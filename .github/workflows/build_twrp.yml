name: Build TWRP Recovery Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'twrp_device_tree/**'
      - 'tools/**'
      - '.github/workflows/build_twrp.yml'

jobs:
  build_twrp:
    name: Build TWRP Recovery Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android /opt/ghc
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig libssl-dev python3 python-is-python3 rsync bc

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Minimal TWRP 10.0 Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "Antigravity CI"
          git config --global user.email "ci@antigravity.local"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          ~/bin/repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Place Device Tree
        run: |
          mkdir -p ~/twrp/device/topway/ts8667
          cp -r twrp_device_tree/* ~/twrp/device/topway/ts8667/

      - name: Build TWRP Recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          set +u
          source build/envsetup.sh || {
            echo "ERROR: envsetup.sh failed"
            exit 1
          }

          if ! lunch omni_ts8667-eng; then
            if ! lunch twrp_ts8667-eng; then
              echo "ERROR: No valid lunch target found"
              exit 1
            fi
          fi

          set -e
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! mka recoveryimage -j"$(nproc --all)" 2>&1 | tee "$BUILD_LOG"; then
            if grep -Fq "could not make way for new symlink: root/vendor" "$BUILD_LOG"; then
              echo "Targeted resolution: clearing conflicting recovery/root/vendor directory..."
              rm -rf out/target/product/ts8667/recovery/root/vendor
              mka recoveryimage -j"$(nproc --all)"
            else
              echo "ERROR: Build failed with non-rsync error; aborting"
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"

      - name: Prepare Artifacts & Add AVB Hash Footer
        run: |
          set -e
          OUT_DIR="$HOME/twrp/out/target/product/ts8667"
          TARGET_FILE="twrp_junsun_${{ github.run_number }}.img"
          if [ ! -f "$OUT_DIR/recovery.img" ]; then
            echo "Recovery image not found in out directory: $OUT_DIR/recovery.img"
            exit 1
          fi

          cp "$OUT_DIR/recovery.img" ./twrp_raw.img

          # Locate avbtool using robust bash array pattern avoiding tilde expansion issues
          AVBTOOL_SCRIPT="$HOME/twrp/external/avb/avbtool"
          if [ -f "$AVBTOOL_SCRIPT" ]; then
            avbtool_cmd=(python3 "$AVBTOOL_SCRIPT")
          elif command -v avbtool >/dev/null 2>&1; then
            avbtool_cmd=(avbtool)
          else
            echo "ERROR: avbtool not found at $AVBTOOL_SCRIPT or in PATH"
            exit 1
          fi
          echo "Using AVB command: ${avbtool_cmd[*]}"

          # Determine RSA key for AVB signing
          AVB_KEY="$HOME/twrp/external/avb/test/data/testkey_rsa2048.pem"
          if [ ! -f "$AVB_KEY" ]; then
            echo "Generating fallback RSA2048 signing key..."
            openssl genrsa -out ./avb_key.pem 2048
            AVB_KEY="./avb_key.pem"
          fi

          # Strict Android Boot Image Header v2 parsing, offset validation and section payload check
          python3 -c '
          import struct, sys, os

          target_path = "./twrp_raw.img"
          with open(target_path, "r+b") as f:
              hdr = f.read(2048)
              magic, k_sz, k_addr, r_sz, r_addr, s_sz, s_addr, tags_addr, page_sz, ver = struct.unpack("<8s9I", hdr[:44])
              if magic != b"ANDROID!":
                  raise ValueError(f"Invalid magic header: {magic}")
              if ver != 2:
                  raise ValueError(f"Expected Android Boot Image v2, got version {ver}")
              if page_sz not in (2048, 4096):
                  raise ValueError(f"Unexpected page size: {page_sz}")
              dtbo_sz, dtbo_off = struct.unpack("<IQ", hdr[1632:1644])
              hdr_sz, dtb_sz, dtb_addr = struct.unpack("<IIQ", hdr[1644:1660])

              if hdr_sz < 1660:
                  raise ValueError(f"Invalid header_size for v2: {hdr_sz} (expected >= 1660)")

              if k_sz == 0:
                  raise ValueError("Kernel payload size is 0")
              if r_sz == 0:
                  raise ValueError("Ramdisk payload size is 0")
              if dtbo_sz == 0:
                  raise ValueError("Recovery DTBO size is 0 (hardware requires DTBO for TS8667 display/touch panel)")
              if dtb_sz == 0:
                  raise ValueError("DTB size is 0 (hardware requires DTB for MT8667 platform boot)")

              def pad(sz): return ((sz + page_sz - 1) // page_sz) * page_sz

              off_k = page_sz
              off_r = off_k + pad(k_sz)
              off_s = off_r + pad(r_sz)
              
              # Validate declared recovery_dtbo_offset against sequential section position
              if dtbo_sz > 0:
                  expected_dtbo_off = off_s + pad(s_sz)
                  if dtbo_off != expected_dtbo_off:
                      raise ValueError(f"Declared DTBO offset mismatch: declared {dtbo_off} != expected {expected_dtbo_off}")
                  
                  # Verify DTBO table structure and declared size
                  f.seek(dtbo_off)
                  dtbo_table_hdr = f.read(32)
                  dtbo_magic, dtbo_total_sz = struct.unpack(">II", dtbo_table_hdr[:8])
                  if dtbo_magic != 0xd7b7ab1e:
                      raise ValueError(f"Invalid DTBO table magic at {dtbo_off}: 0x{dtbo_magic:08x} (expected 0xd7b7ab1e)")
                  if dtbo_total_sz != dtbo_sz:
                      raise ValueError(f"DTBO total_size mismatch: table header {dtbo_total_sz} != boot header {dtbo_sz}")
                  print(f"Validated Recovery DTBO table at {dtbo_off}: magic=0xd7b7ab1e, size={dtbo_total_sz} bytes")
                  off_dtb = dtbo_off + pad(dtbo_sz)
              else:
                  off_dtb = off_s + pad(s_sz)

              # Validate DTB structure, entry 0, and internal FDT payload with strict bounds checks
              if dtb_sz > 0:
                  f.seek(off_dtb)
                  dtb_table_hdr = f.read(32)
                  if len(dtb_table_hdr) != 32:
                      raise ValueError(f"Truncated DTB table header: read {len(dtb_table_hdr)} bytes < 32")
                  dtb_magic, dtb_total_sz, dtb_hdr_sz, entry_sz, entry_count, entries_off = struct.unpack(">IIIIII", dtb_table_hdr[:24])
                  if dtb_magic != 0xd7b7ab1e:
                      raise ValueError(f"Invalid DTB magic at {off_dtb}: 0x{dtb_magic:08x} (expected 0xd7b7ab1e)")
                  if dtb_total_sz != dtb_sz or dtb_total_sz < 32:
                      raise ValueError(f"Invalid DTB table size: {dtb_total_sz} != {dtb_sz} or < 32")
                  if dtb_hdr_sz < 32:
                      raise ValueError(f"Invalid DTB header size: {dtb_hdr_sz} < 32")
                  if entry_sz < 8:
                      raise ValueError(f"Invalid DTB entry size: {entry_sz} < 8")
                  if entries_off < dtb_hdr_sz:
                      raise ValueError(f"Invalid DTB entries offset: {entries_off} < {dtb_hdr_sz}")
                  if entry_count < 1:
                      raise ValueError("DTB table contains 0 entries")

                  entries_end = entries_off + (entry_count * entry_sz)
                  if entries_end > dtb_total_sz:
                      raise ValueError(f"DTB entries boundary {entries_end} exceeds table size {dtb_total_sz}")

                  # Verify Entry 0 and FDT payload within table boundaries
                  f.seek(off_dtb + entries_off)
                  entry0_data = f.read(entry_sz)
                  if len(entry0_data) < 8:
                      raise ValueError("Truncated entry 0 read in DTB table")
                  entry0_sz, entry0_off = struct.unpack(">II", entry0_data[:8])

                  if entry0_off < entries_end:
                      raise ValueError(f"Entry 0 offset {entry0_off} overlaps entries table (end={entries_end})")
                  if (entry0_off + entry0_sz) > dtb_total_sz:
                      raise ValueError(f"Entry 0 FDT payload {entry0_off + entry0_sz} exceeds DTB table size {dtb_total_sz}")

                  f.seek(off_dtb + entry0_off)
                  fdt_hdr = f.read(8)
                  if len(fdt_hdr) != 8:
                      raise ValueError("Truncated FDT header read")
                  fdt_magic, fdt_totalsize = struct.unpack(">II", fdt_hdr)
                  if fdt_magic != 0xd00dfeed:
                      raise ValueError(f"Invalid FDT magic at DTB entry 0 offset +{entry0_off}: 0x{fdt_magic:08x} (expected 0xd00dfeed)")
                  if fdt_totalsize != entry0_sz:
                      raise ValueError(f"FDT totalsize {fdt_totalsize} != entry 0 dt_size {entry0_sz}")

                  print(f"Validated DTB table at {off_dtb}: size={dtb_total_sz}, entry 0 FDT at +{entry0_off} (size={fdt_totalsize} bytes)")
                  total_payload = off_dtb + pad(dtb_sz)
              else:
                  total_payload = off_dtb

              current_sz = f.seek(0, 2)
              print(f"Boot v2 Header rigorously validated: ver={ver}, hdr_sz={hdr_sz}, page_sz={page_sz}")
              print(f"  Kernel: offset={off_k}, size={k_sz} (padded={pad(k_sz)})")
              print(f"  Ramdisk: offset={off_r}, size={r_sz} (padded={pad(r_sz)})")
              print(f"  DTBO: offset={dtbo_off}, size={dtbo_sz}")
              print(f"  DTB: offset={off_dtb}, size={dtb_sz}")
              print(f"Calculated payload boundary: {total_payload} bytes (current file size: {current_sz} bytes)")

              if total_payload > 33484800:
                  raise ValueError(f"Payload {total_payload} exceeds max allowed size 33484800 for 32MB partition")

              if current_sz < total_payload:
                  raise ValueError(f"Truncated input image: current file size {current_sz} bytes < required payload {total_payload} bytes")

              if current_sz > total_payload:
                  print(f"Truncating {target_path} from {current_sz} to exact payload {total_payload} bytes")
                  f.truncate(total_payload)
          '

          # Inject AVB hash footer
          "${avbtool_cmd[@]}" add_hash_footer \
            --image ./twrp_raw.img \
            --partition_size 33554432 \
            --partition_name recovery \
            --algorithm SHA256_RSA2048 \
            --key "$AVB_KEY"

          # Verify partition size
          ACTUAL_SIZE=$(stat -c%s ./twrp_raw.img)
          echo "Generated image size: $ACTUAL_SIZE bytes"
          if [ "$ACTUAL_SIZE" -ne 33554432 ]; then
            echo "ERROR: Partition size mismatch. Expected 33554432 bytes, got $ACTUAL_SIZE bytes"
            exit 1
          fi

          # Structural metadata inspection
          "${avbtool_cmd[@]}" info_image --image ./twrp_raw.img > avb_verification_report.txt
          echo "=== AVB Structural Metadata Report ==="
          cat avb_verification_report.txt

          grep -q "Footer version:.*1.0" avb_verification_report.txt || { echo "ERROR: Missing AVB Footer version 1.0"; exit 1; }
          grep -q "Partition Name:.*recovery" avb_verification_report.txt || { echo "ERROR: Partition name is not recovery"; exit 1; }
          grep -q "Algorithm:.*SHA256_RSA2048" avb_verification_report.txt || { echo "ERROR: Algorithm is not SHA256_RSA2048"; exit 1; }

          # Cryptographic signature and hash descriptor verification
          mkdir -p /tmp/verify_twrp
          cp ./twrp_raw.img /tmp/verify_twrp/recovery.img
          "${avbtool_cmd[@]}" verify_image --image /tmp/verify_twrp/recovery.img > avb_crypto_verification.txt
          echo "=== AVB Cryptographic Verification Report ==="
          cat avb_crypto_verification.txt

          grep -q "Successfully verified footer and SHA256_RSA2048 vbmeta struct" avb_crypto_verification.txt || {
            echo "ERROR: Cryptographic signature verification failed"
            exit 1
          }
          grep -q "Successfully verified sha256 hash" avb_crypto_verification.txt || {
            echo "ERROR: Cryptographic hash descriptor verification failed"
            exit 1
          }

          # Calculate SHA-256
          sha256sum ./twrp_raw.img > sha256_recovery.txt
          echo "=== SHA-256 Digest ==="
          cat sha256_recovery.txt

          mv ./twrp_raw.img ./${TARGET_FILE}
          echo "TARGET_FILE=${TARGET_FILE}" >> $GITHUB_ENV

      - name: Upload TWRP Recovery Image & Reports
        uses: actions/upload-artifact@v4
        with:
          name: twrp_junsun_${{ github.run_number }}_package
          path: |
            ./${{ env.TARGET_FILE }}
            avb_verification_report.txt
            avb_crypto_verification.txt
            sha256_recovery.txt
          if-no-files-found: error
