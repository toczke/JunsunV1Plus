name: Build TWRP Recovery Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'twrp_device_tree/**'
      - 'tools/**'
      - '.github/workflows/build_twrp.yml'

jobs:
  build_twrp:
    name: Build TWRP Recovery Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android /opt/ghc
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig libssl-dev python3 python-is-python3 rsync bc

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Minimal TWRP 10.0 Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "Antigravity CI"
          git config --global user.email "ci@antigravity.local"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          ~/bin/repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Place Device Tree
        run: |
          mkdir -p ~/twrp/device/topway/ts8667
          cp -r twrp_device_tree/* ~/twrp/device/topway/ts8667/

      - name: Build TWRP Recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          # Note on nounset (+u): AOSP build scripts (envsetup.sh, lunch, mka) rely on
          # bash treating uninitialized variables as empty strings (e.g. build/envsetup.sh:646).
          # Enabling set -u breaks AOSP tools with "unbound variable".
          # Strict error containment is maintained via set -e and set -o pipefail.
          set +u
          source build/envsetup.sh || {
            echo "ERROR: envsetup.sh failed"
            exit 1
          }

          if ! lunch omni_ts8667-eng; then
            if ! lunch twrp_ts8667-eng; then
              echo "ERROR: No valid lunch target found"
              exit 1
            fi
          fi

          set -e
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! mka recoveryimage -j"$(nproc --all)" 2>&1 | tee "$BUILD_LOG"; then
            if grep -Fq "could not make way for new symlink: root/vendor" "$BUILD_LOG"; then
              echo "Targeted resolution: clearing conflicting recovery/root/vendor directory..."
              rm -rf out/target/product/ts8667/recovery/root/vendor
              mka recoveryimage -j"$(nproc --all)"
            else
              echo "ERROR: Build failed with non-rsync error; aborting"
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"

      - name: Prepare Artifacts & Add AVB Hash Footer
        run: |
          set -e
          OUT_DIR="$HOME/twrp/out/target/product/ts8667"
          TARGET_FILE="twrp_junsun_${{ github.run_number }}.img"
          if [ ! -f "$OUT_DIR/recovery.img" ]; then
            echo "Recovery image not found in out directory: $OUT_DIR/recovery.img"
            exit 1
          fi

          cp "$OUT_DIR/recovery.img" ./twrp_raw.img

          # Locate avbtool using robust bash array pattern avoiding tilde expansion issues
          AVBTOOL_SCRIPT="$HOME/twrp/external/avb/avbtool"
          if [ -f "$AVBTOOL_SCRIPT" ]; then
            avbtool_cmd=(python3 "$AVBTOOL_SCRIPT")
          elif command -v avbtool >/dev/null 2>&1; then
            avbtool_cmd=(avbtool)
          else
            echo "ERROR: avbtool not found at $AVBTOOL_SCRIPT or in PATH"
            exit 1
          fi
          echo "Using AVB command: ${avbtool_cmd[*]}"

          # Determine RSA key for AVB signing
          AVB_KEY="$HOME/twrp/external/avb/test/data/testkey_rsa2048.pem"
          if [ ! -f "$AVB_KEY" ]; then
            echo "Generating fallback RSA2048 signing key..."
            openssl genrsa -out ./avb_key.pem 2048
            AVB_KEY="./avb_key.pem"
          fi

          # Strict Android Boot Image Header v2 parsing, offset validation, DT table check and payload truncation
          # Uses the single canonical tools/validate_boot_v2.py shared between local testing and CI
          python3 tools/validate_boot_v2.py ./twrp_raw.img --truncate --max-partition-size 33554432 > boot_v2_validation_report.txt
          cat boot_v2_validation_report.txt

          # Inject AVB hash footer
          "${avbtool_cmd[@]}" add_hash_footer \
            --image ./twrp_raw.img \
            --partition_size 33554432 \
            --partition_name recovery \
            --algorithm SHA256_RSA2048 \
            --key "$AVB_KEY"

          # Verify partition size
          ACTUAL_SIZE=$(stat -c%s ./twrp_raw.img)
          echo "Generated image size: $ACTUAL_SIZE bytes"
          if [ "$ACTUAL_SIZE" -ne 33554432 ]; then
            echo "ERROR: Partition size mismatch. Expected 33554432 bytes, got $ACTUAL_SIZE bytes"
            exit 1
          fi

          # Structural metadata inspection
          "${avbtool_cmd[@]}" info_image --image ./twrp_raw.img > avb_verification_report.txt
          echo "=== AVB Structural Metadata Report ==="
          cat avb_verification_report.txt

          grep -q "Footer version:.*1.0" avb_verification_report.txt || { echo "ERROR: Missing AVB Footer version 1.0"; exit 1; }
          grep -q "Partition Name:.*recovery" avb_verification_report.txt || { echo "ERROR: Partition name is not recovery"; exit 1; }
          grep -q "Algorithm:.*SHA256_RSA2048" avb_verification_report.txt || { echo "ERROR: Algorithm is not SHA256_RSA2048"; exit 1; }

          # Cryptographic signature and hash descriptor verification
          mkdir -p /tmp/verify_twrp
          cp ./twrp_raw.img /tmp/verify_twrp/recovery.img
          "${avbtool_cmd[@]}" verify_image --image /tmp/verify_twrp/recovery.img > avb_crypto_verification.txt
          echo "=== AVB Cryptographic Verification Report ==="
          cat avb_crypto_verification.txt

          grep -q "Successfully verified footer and SHA256_RSA2048 vbmeta struct" avb_crypto_verification.txt || {
            echo "ERROR: Cryptographic signature verification failed"
            exit 1
          }
          grep -q "Successfully verified sha256 hash" avb_crypto_verification.txt || {
            echo "ERROR: Cryptographic hash descriptor verification failed"
            exit 1
          }

          # Calculate SHA-256
          sha256sum ./twrp_raw.img > sha256_recovery.txt
          echo "=== SHA-256 Digest ==="
          cat sha256_recovery.txt

          mv ./twrp_raw.img ./${TARGET_FILE}
          echo "TARGET_FILE=${TARGET_FILE}" >> $GITHUB_ENV

      - name: Upload TWRP Recovery Image & Reports
        uses: actions/upload-artifact@v4
        with:
          name: twrp_junsun_${{ github.run_number }}_package
          path: |
            ./${{ env.TARGET_FILE }}
            boot_v2_validation_report.txt
            avb_verification_report.txt
            avb_crypto_verification.txt
            sha256_recovery.txt
          if-no-files-found: error
