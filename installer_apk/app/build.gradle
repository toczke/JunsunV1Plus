plugins {
    id 'com.android.application'
}

android {
    namespace 'com.topway.twrpinstaller'
    compileSdk 33

    defaultConfig {
        applicationId "com.topway.twrpinstaller"
        minSdk 23
        targetSdk 29 // Android 10 target
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Minimal standard dependencies without bloat
}
